<!DOCTYPE html>
<html lang="zh-CN" data-accent="R" data-skin="paper">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>每日成语 · 日历挂件</title>
<meta name="description" content="每日一条成语，仿老黄历撕历：拼音、逐字拆解、中英释义、例句，附农历与二十四节气。" />
<meta name="theme-color" content="#e7d9ba" />
<style>
  :root{
    /* 纸色（默认皮肤：米黄） */
    --bg1:rgba(255,252,240,.9); --bg2:#e7d9ba; --bg3a:#eee2cb; --bg3b:#d9cbae;
    --paper:#f8f2e4; --paper-2:#efe5cd; --paper-3:#fbf6ea;
    --ink:#33291f; --muted:#8b7a5f; --muted-2:#a4957c;
    --line:#cbb98d; --line-dark:#a9955c; --gold:#b5912e; --gold-2:#8f711f;
    --surface:#fffdf6; --surface-2:#f3ead2;      /* 凸起卡/按钮 */
    --soft:rgba(255,255,255,.38);                /* 半透明面 */
    --soft-strong:#fffdf6;
    --rim:rgba(255,255,255,.55);                 /* 卡片内高光 */
    --accent:#b23f2e; --accent-ink:#9a3327; --accent-glow:rgba(178,63,46,.16);
    --shadow:85,64,36;
    --serif:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Songti SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --latin:"Times New Roman",Georgia,"Songti SC",serif;
  }
  html[data-accent="G"]{ --accent:#1c7a53; --accent-ink:#135c40; --accent-glow:rgba(28,122,83,.16); }

  /* 皮肤：宣纸（冷白） */
  html[data-skin="rice"]{
    --bg1:rgba(255,255,255,.9); --bg2:#dfe2da; --bg3a:#eef0ea; --bg3b:#d6d9cf;
    --paper:#f4f5ef; --paper-2:#e9ebe2; --paper-3:#fafbf6;
    --ink:#2d2f2a; --muted:#7d8072; --muted-2:#9a9c8e;
    --line:#c7c9bc; --line-dark:#a7a999; --gold:#9c8c50; --gold-2:#7f7238;
    --surface:#ffffff; --surface-2:#eceee6;
    --soft:rgba(255,255,255,.5); --soft-strong:#ffffff; --rim:rgba(255,255,255,.7);
    --shadow:70,72,60;
  }
  html[data-accent="G"][data-skin="rice"]{ --accent:#1c7a53; --accent-ink:#12583c; --accent-glow:rgba(28,122,83,.14); }

  /* 皮肤：夜间（深色） */
  html[data-skin="dark"]{
    --bg1:rgba(70,62,48,.5); --bg2:#171310; --bg3a:#26211a; --bg3b:#14110d;
    --paper:#2d2820; --paper-2:#241f18; --paper-3:#332d24;
    --ink:#eee2cd; --muted:#b0a184; --muted-2:#8f8168;
    --line:#584c39; --line-dark:#6d5f45; --gold:#d8b45a; --gold-2:#b8933f;
    --surface:#3a3327; --surface-2:#2c261e;
    --soft:rgba(255,255,255,.055); --soft-strong:#3a3327; --rim:rgba(255,255,255,.10);
    --accent:#e0674f; --accent-ink:#c9503a; --accent-glow:rgba(224,103,79,.20);
    --shadow:0,0,0;
  }
  html[data-accent="G"][data-skin="dark"]{ --accent:#37b483; --accent-ink:#2a9c6e; --accent-glow:rgba(55,180,131,.20); }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:26px 16px calc(26px + env(safe-area-inset-bottom));
    font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(1000px 520px at 18% -12%, var(--bg1), transparent 60%),
      radial-gradient(900px 620px at 112% 118%, var(--bg2), transparent 55%),
      linear-gradient(160deg,var(--bg3a),var(--bg3b) 100%);
    background-attachment:fixed;
    position:relative; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
    transition:color .3s ease;
  }
  body::before, body::after{
    content:""; position:fixed; border-radius:50%; filter:blur(2px); opacity:.4; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), rgba(225,205,160,.15) 70%);
    z-index:0;
  }
  html[data-skin="dark"] body::before, html[data-skin="dark"] body::after{ opacity:.14; }
  body::before{ width:320px; height:320px; top:-80px; left:-90px; }
  body::after{ width:420px; height:420px; bottom:-140px; right:-120px; }
  .bg-dots{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:radial-gradient(rgba(120,100,60,.10) 1px, transparent 1px);
    background-size:22px 22px;
  }
  html[data-skin="dark"] .bg-dots{ opacity:.25; background-image:radial-gradient(rgba(255,230,180,.06) 1px, transparent 1px); }

  /* ---------- 顶栏 ---------- */
  .toolbar{
    position:relative; z-index:2; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
    max-width:480px; width:100%;
  }
  .brand{ font-family:var(--serif); font-size:18px; letter-spacing:3px; color:var(--ink); margin-right:auto; white-space:nowrap; display:flex; align-items:center; gap:9px; }
  .brand .seal{
    width:20px; height:20px; border-radius:5px; background:linear-gradient(135deg,#c5452f,#a23a27);
    display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; font-family:var(--serif);
    box-shadow:0 1px 3px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .brand small{ font-size:11px; letter-spacing:1px; color:var(--muted); font-family:var(--sans); font-weight:400; }

  .seg{ display:inline-flex; border:1px solid var(--line-dark); border-radius:11px; overflow:hidden; box-shadow:inset 0 1px 0 var(--rim), 0 2px 0 rgba(0,0,0,.10); background:var(--surface-2); }
  .seg button{ appearance:none; border:0; background:transparent; color:var(--muted); padding:7px 11px; font-size:12.5px; font-family:var(--sans); cursor:pointer; transition:background .15s, color .15s; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button.on{ background:linear-gradient(180deg,var(--accent),var(--accent-ink)); color:#fff; }

  .btn{
    appearance:none; border:1px solid var(--line-dark);
    background:linear-gradient(180deg,var(--surface),var(--surface-2)); color:var(--ink);
    border-radius:11px; padding:8px 13px; font-size:13px; font-family:var(--sans); cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.14), inset 0 1px 0 var(--rim); transition:transform .06s, box-shadow .06s, filter .15s;
  }
  .btn:hover{ filter:brightness(1.04); }
  .btn:active{ transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .btn.primary{ background:linear-gradient(180deg,var(--accent),var(--accent-ink)); color:#fff6ec; border-color:var(--accent-ink); box-shadow:0 3px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.18); }
  .btn.round{ padding:8px 16px; font-size:15px; }

  /* ---------- 卡片舞台 ---------- */
  .stage{ position:relative; z-index:2; width:100%; max-width:480px; perspective:1400px; }
  .card{
    position:relative; width:100%; border-radius:20px; padding:24px 26px 30px;
    background:
      radial-gradient(60% 40% at 30% 0%, var(--rim), transparent 70%),
      linear-gradient(180deg,var(--paper) 0%,var(--paper-2) 100%);
    box-shadow:
      0 34px 66px -22px rgba(var(--shadow),.55), 0 8px 20px -8px rgba(var(--shadow),.30),
      inset 0 0 0 1px var(--rim), inset 0 0 60px rgba(190,158,92,.10);
    transform-origin:top center; will-change:transform, opacity;
    transition:background .3s ease;
  }
  .card::before{
    content:""; position:absolute; inset:8px; border:1px solid var(--line); border-radius:13px; pointer-events:none;
    background-image:
      repeating-linear-gradient(90deg, rgba(120,100,60,.03) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(0deg, rgba(120,100,60,.025) 0 1px, transparent 1px 4px);
  }
  html[data-skin="dark"] .card::before{ background-image:none; }
  .card::after{ content:""; position:absolute; inset:12px; border:1px solid var(--line); border-radius:10px; pointer-events:none; opacity:.7; }
  .orn{ position:absolute; pointer-events:none; color:var(--gold); font-family:serif; font-size:15px; }
  .orn.tl{ top:15px; left:18px; } .orn.tr{ top:15px; right:18px; }
  .pins{ position:absolute; top:11px; left:0; right:0; display:flex; justify-content:space-around; padding:0 40px; pointer-events:none; }
  .pins span{ width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, #cbb98d 55%, #9b854b); box-shadow:0 1px 2px rgba(0,0,0,.4), inset 0 -1px 1px rgba(0,0,0,.25); }
  .tear{
    position:absolute; left:0; right:0; bottom:-12px; height:16px; pointer-events:none;
    background:
      repeating-linear-gradient(115deg, transparent 0 6px, var(--rim) 6px 7px, transparent 7px 13px),
      repeating-linear-gradient(245deg, transparent 0 6px, var(--rim) 6px 7px, transparent 7px 13px);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .stamp{
    position:absolute; top:64px; right:-9px; z-index:3; writing-mode:vertical-rl; text-orientation:upright;
    font-family:var(--serif); font-size:13px; letter-spacing:4px; color:#fff4ec;
    background:linear-gradient(135deg,var(--accent),var(--accent-ink)); padding:12px 5px; border-radius:5px;
    box-shadow:0 6px 14px -6px var(--accent), inset 0 1px 0 rgba(255,255,255,.25);
  }

  @keyframes sheetNext{ 0%{ opacity:0; transform:translateY(-14px) rotateX(-18deg) scale(.985);} 60%{opacity:1;} 100%{opacity:1; transform:none;} }
  @keyframes sheetPrev{ 0%{ opacity:0; transform:translateY(14px) rotateX(14deg) scale(.985);} 60%{opacity:1;} 100%{opacity:1; transform:none;} }
  .card.in-next{ animation:sheetNext .42s cubic-bezier(.22,.9,.24,1) both; }
  .card.in-prev{ animation:sheetPrev .42s cubic-bezier(.22,.9,.24,1) both; }

  /* ---------- 日期栏 ---------- */
  .date-row{ display:flex; align-items:stretch; justify-content:center; gap:6px; margin:18px 0 6px; }
  .date-cell{ display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--line-dark); background:linear-gradient(180deg,var(--surface),var(--surface-2)); border-radius:9px; padding:6px 10px; box-shadow:inset 0 1px 0 var(--rim); }
  .date-cell.wide{ min-width:96px; }
  .date-cell .lbl{ font-size:9px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
  .date-cell .val{ font-family:var(--serif); font-size:20px; line-height:1.15; white-space:nowrap; color:var(--ink); }
  .date-cell .val.day{ font-size:17px; }
  .sep-dot{ align-self:center; width:5px; height:5px; border-radius:50%; background:var(--line-dark); opacity:.7; }
  .date-cell.term{ background:linear-gradient(180deg,var(--accent-glow), var(--soft)); border-color:var(--accent); }
  .date-cell.term .val{ color:var(--accent); }

  .lunar-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 2px 18px; padding:7px 12px; border:1px dashed var(--line); border-radius:10px; background:var(--soft); }
  .lunar-bar .left{ display:flex; align-items:center; gap:8px; font-family:var(--serif); font-size:14px; letter-spacing:1px; color:var(--ink); }
  .lunar-bar .left .mark{ color:var(--gold); font-size:12px; }
  .termpill{ display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 9px; border-radius:20px; color:var(--muted); border:1px solid var(--line); background:var(--soft-strong); font-family:var(--sans); white-space:nowrap; }
  .termpill.on{ color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-ink)); border-color:transparent; box-shadow:0 2px 6px -2px var(--accent); }
  .termpill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.7; }

  .idiom-panel{ position:relative; border:2px solid var(--gold); border-radius:14px; background:linear-gradient(180deg, var(--soft), transparent), var(--accent-glow); padding:22px 10px 16px; text-align:center; overflow:hidden; }
  .idiom-panel .wave{ position:absolute; inset:0; pointer-events:none; opacity:.5; background:radial-gradient(120px 40px at 50% 120%, var(--rim), transparent 70%); }
  .top-orn{ position:absolute; top:-1px; left:50%; transform:translateX(-50%); font-family:var(--serif); color:var(--gold); font-size:12px; letter-spacing:9px; background:var(--paper); padding:0 9px; border-radius:4px; white-space:nowrap; }
  .idiom-big{ display:flex; justify-content:center; gap:10px; margin-top:10px; font-family:var(--serif); }
  .idiom-big .ch{ font-size:64px; line-height:1; color:var(--accent); text-shadow:0 1px 0 var(--rim), 0 3px 6px rgba(0,0,0,.10); animation:pop .5s cubic-bezier(.2,.9,.25,1) both; }
  .idiom-big .ch:nth-child(2){ animation-delay:.06s; }
  .idiom-big .ch:nth-child(3){ animation-delay:.12s; }
  .idiom-big .ch:nth-child(4){ animation-delay:.18s; }
  .idiom-big .ch:nth-child(n+5){ animation-delay:.24s; }
  @keyframes pop{ 0%{opacity:0; transform:translateY(10px) scale(.9);} 100%{opacity:1; transform:none;} }
  .idiom-pinyin{ margin-top:12px; font-size:13px; letter-spacing:3px; color:var(--muted); font-family:var(--latin); }

  .char-row{ display:flex; gap:8px; justify-content:center; margin:18px 0 22px; }
  .char-cell{ flex:1 1 0; min-width:0; border:1px solid var(--line); border-radius:9px; background:var(--soft); padding:9px 4px 7px; text-align:center; transition:transform .2s, box-shadow .2s, background .2s; }
  .char-cell:hover{ transform:translateY(-3px); box-shadow:0 8px 16px -8px rgba(0,0,0,.4); background:var(--surface); }
  .char-cell .big{ font-family:var(--serif); font-size:30px; line-height:1; color:var(--ink); }
  .char-cell .py{ margin-top:5px; font-size:11px; color:var(--muted); font-family:var(--latin); }

  .body{ text-align:left; }
  .block{ position:relative; margin:12px 0; padding-left:14px; }
  .block::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px; background:linear-gradient(180deg,var(--accent),transparent); }
  .tag{ display:inline-block; font-size:10px; letter-spacing:2px; color:var(--accent); border:1px solid var(--accent); border-radius:5px; padding:1px 7px; margin-bottom:6px; font-weight:600; text-transform:uppercase; background:var(--accent-glow); }
  .block p{ margin:3px 0 0; line-height:1.68; color:var(--ink); }
  .block .py{ font-size:12px; color:var(--muted); font-style:italic; }
  .block .en{ font-size:12px; color:var(--muted-2); }

  .foot{ margin-top:16px; padding-top:12px; border-top:1px solid var(--line); text-align:center; font-size:11px; color:var(--muted); letter-spacing:1px; }

  .controls{ position:relative; z-index:2; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; max-width:480px; width:100%; }
  .controls .btn{ flex:1 1 auto; min-width:96px; }
  .hint{ position:relative; z-index:2; font-size:11px; color:var(--muted-2); letter-spacing:.5px; }
  .hint b{ color:var(--ink); font-weight:600; }

  /* Toast */
  .toast{ position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); z-index:20; padding:10px 18px; border-radius:12px; background:var(--accent); color:#fff; font-size:13px; box-shadow:0 10px 24px -8px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* 操作行 */
  .actions{ position:relative; z-index:2; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; max-width:480px; width:100%; }
  .actions .btn{ flex:1 1 auto; min-width:88px; }
  .btn.fav.on{ color:#fff; background:linear-gradient(180deg,var(--accent),var(--accent-ink)); border-color:var(--accent-ink); }

  /* 浏览面板 */
  .overlay{ position:fixed; inset:0; z-index:30; background:rgba(20,15,8,.5); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s; }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .panel{ width:100%; max-width:520px; max-height:82vh; max-height:82dvh; display:flex; flex-direction:column; background:linear-gradient(180deg,var(--paper-3),var(--paper-2)); border:1px solid var(--line-dark); border-bottom:0; border-radius:18px 18px 0 0; box-shadow:0 -20px 50px -20px rgba(0,0,0,.5); transform:translateY(30px); transition:transform .28s cubic-bezier(.2,.9,.25,1); }
  .overlay.show .panel{ transform:none; }
  .panel-head{ display:flex; align-items:center; gap:10px; padding:14px 16px 8px; }
  .panel-head .ttl{ font-family:var(--serif); font-size:16px; letter-spacing:2px; color:var(--ink); margin-right:auto; }
  .panel-head .x{ appearance:none; border:1px solid var(--line-dark); background:var(--surface); color:var(--ink); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px; line-height:1; }
  .search{ margin:0 16px 8px; }
  .search input{ width:100%; padding:9px 12px; border:1px solid var(--line-dark); border-radius:10px; background:var(--surface); color:var(--ink); font-size:14px; font-family:var(--sans); }
  .search input::placeholder{ color:var(--muted-2); }
  .chips{ display:flex; gap:6px; overflow-x:auto; padding:2px 16px 10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; padding:5px 11px; border-radius:16px; border:1px solid var(--line-dark); background:var(--surface); color:var(--muted); font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .chip.on{ color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-ink)); border-color:transparent; }
  .grid{ overflow-y:auto; padding:4px 16px calc(20px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr)); gap:8px; }
  .gcell{ border:1px solid var(--line); border-radius:10px; background:var(--soft); padding:10px 4px; text-align:center; cursor:pointer; transition:transform .12s, background .12s; }
  .gcell:hover{ transform:translateY(-2px); background:var(--surface); }
  .gcell .gi{ font-family:var(--serif); font-size:18px; color:var(--ink); }
  .gcell .gp{ font-size:10px; color:var(--muted); font-family:var(--latin); margin-top:3px; }
  .gcell .gh{ color:var(--accent); }
  .empty{ grid-column:1/-1; text-align:center; color:var(--muted); padding:24px; font-size:13px; }

  @media (max-width:440px){
    .idiom-big .ch{ font-size:50px; gap:6px; }
    .date-cell .val{ font-size:16px; }
    .date-cell.wide{ min-width:72px; }
    .date-cell{ padding:6px 6px; }
    .brand{ font-size:15px; letter-spacing:2px; }
    .brand small{ display:none; }
    .stamp{ display:none; }
    .hint{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ .card.in-next,.card.in-prev,.idiom-big .ch{ animation:none; } }
</style>
</head>
<body>
  <div class="bg-dots"></div>

  <div class="toolbar">
    <span class="brand"><span class="seal">语</span>每日成语<small>· 黄历挂件</small></span>
    <span class="seg" id="segAccent" role="group" aria-label="配色">
      <button data-v="auto" class="on">自动</button>
      <button data-v="R">红</button>
      <button data-v="G">绿</button>
    </span>
    <button class="btn" id="btnSkin" title="切换纸张皮肤">皮肤·米黄</button>
    <button class="btn" id="btnShare" title="复制今日成语文案">分享</button>
    <button class="btn" id="btnToday">今天</button>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="pins"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="orn tl">❋</div><div class="orn tr">❋</div>
      <div class="stamp" id="stamp">每日一语</div>
      <div class="tear"></div>

      <div class="date-row">
        <div class="date-cell wide"><span class="lbl">月·日</span><span class="val day" id="md">—月—日</span></div>
        <div class="sep-dot"></div>
        <div class="date-cell"><span class="lbl">年</span><span class="val year" id="year">2026</span></div>
        <div class="sep-dot"></div>
        <div class="date-cell"><span class="lbl">星期</span><span class="val" id="week">星期日</span></div>
        <div class="sep-dot"></div>
        <div class="date-cell term"><span class="lbl">节气</span><span class="val" id="term">--</span></div>
      </div>

      <div class="lunar-bar">
        <span class="left"><span class="mark">◈</span><span id="lunar">农历 --</span></span>
        <span class="termpill" id="termpill"><span class="dot"></span><span id="termpillText">--</span></span>
      </div>

      <div class="idiom-panel">
        <div class="wave"></div>
        <span class="top-orn">❖ 成 语 ❖</span>
        <div class="idiom-big" id="big"></div>
        <div class="idiom-pinyin" id="pinyin"></div>
      </div>

      <div class="char-row" id="charRow"></div>

      <div class="body">
        <div class="block"><span class="tag">释义 Meaning</span><p id="meaningCn"></p><p class="en" id="meaningEn"></p></div>
        <div class="block"><span class="tag">例句 Example</span><p id="exampleCn"></p><p class="py" id="examplePy"></p><p class="en" id="exampleEn"></p></div>
      </div>

      <div class="foot" id="foot"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary round" id="btnPrev">◀ 前一天</button>
    <button class="btn primary round" id="btnNext">后一天 ▶</button>
  </div>
  <div class="actions">
    <button class="btn" id="btnRandom">🎲 随机</button>
    <button class="btn fav" id="btnFav">♡ 收藏</button>
    <button class="btn" id="btnBrowse">☰ 浏览</button>
  </div>
  <div class="hint">← / → 翻页 · <b>空格</b> 回到今天 · 手机可左右滑动</div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="panel-head">
        <span class="ttl">成语库 · <span id="panelCount">0</span></span>
        <button class="x" id="btnClose" aria-label="关闭">✕</button>
      </div>
      <div class="search"><input id="searchInput" type="search" placeholder="搜索成语 / 拼音 / 释义…" autocomplete="off" /></div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

  <script src="data.js"></script>
  <script src="data2.js"></script>
  <script src="data3.js"></script>
  <script src="data4.js"></script>
  <script src="data5.js"></script>
  <script src="lunar.js"></script>
  <script>
    const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
    const MONTHS = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
    const SKINS = [["paper","米黄"],["rice","宣纸"],["dark","夜间"]];
    const SITE = "https://bosswenwu.github.io/daily-idiom-calendar/";
    const state = { offset:0, accent:"auto", skin:0, pickIndex:null };
    const $ = id => document.getElementById(id);
    const L = window.lunar;
    const card = $("card");
    const overlay = $("overlay"), chips = $("chips"), grid = $("grid"), searchInput = $("searchInput");
    let current = null;

    // ------- 分类（按关键词自动归类，无需逐条标注）-------
    const CAT_DEFS = [
      ["学习进取", /学|读|勤|苦|钻|恒|不懈|进取|上进|奋|博学|求知|温故|举一|熟能|勤能|笨鸟|上游|赶上|竿头|厚积|积少|聚沙|集腋/],
      ["品格诚信", /诚|信|谦|德|廉|操守|坦|磊落|表里|一诺|一言|光明|厚德|自强|矢志|坚定|始终|正大|恪|尽职|任劳/],
      ["谋略行事", /谋|策|计|决断|布局|全局|周密|谨慎|防|统筹|果断|雷厉|大刀|运筹|审时|随机|未雨|居安|临危|处变|镇定|当机|三思|兼顾|面面|稳扎|步步|脚踏|实事|精打|一举|事半|立竿|水到|顺理/],
      ["团结情谊", /团结|齐心|协力|同心|同舟|风雨|情|友|谊|亲|扶|助|恩|报|守望|肝胆|患难|相濡|手足|将心|设身|礼尚|投桃|众志|戮力|和衷|万众|众擎|举案|相敬|白头|心心|形影/],
      ["心境情绪", /乐|喜|欢|悦|愉|镇定|从容|平静|安|怡|旷|泰然|知足|随遇|兴高|兴致|心花|神采|精神|容光|眉开|喜笑|欢天|悠然|自得|生龙|龙腾|龙马|抖擞/],
      ["成功成就", /成功|成就|胜|荣|兴旺|发展|前途|前程|似锦|名|杰出|出众|第一|卓|登峰|飞黄|平步|鹏程|东山|卷土|力挽|扭转|化险|转危|绝处|独占|首屈|无与|举世|独一|鹤立|马到|旗开|一帆|如意|心想|宏图|蒸蒸|欣欣|如日|大有/],
      ["景物自然", /山|水|花|鸟|春|秋|月|云|风和|风景|景|美不|湖|草|自然|世外|洞天|风光|万紫|姹紫|五彩|琳琅|崇山|一望|一马|皓月|秋高|天高|青山/],
      ["才华技艺", /才|艺|技|巧|妙|笔|文章|生动|逼真|精益|画|栩栩|惟妙|淋漓|入木|一针|绘声|活灵|信手|一挥|一气|鞭辟|高屋|言简|一语|耐人|意味|发人|独具|别具|独树|标新|别出|炉火|出神|鬼斧|巧夺|游刃|得心|驾轻/],
    ];
    function catOf(x){ const s = x.idiom + " " + x.meaningCn; for(const [name,re] of CAT_DEFS){ if(re.test(s)) return name; } return "综合"; }
    IDIOMS.forEach(x=> x._cat = catOf(x));
    const CATS = ["全部","收藏", ...CAT_DEFS.map(c=>c[0]), "综合"];

    // ------- 收藏（本地存储）-------
    function getFavs(){ try{ return JSON.parse(localStorage.getItem("dic_favs")||"[]"); }catch(e){ return []; } }
    function setFavs(a){ try{ localStorage.setItem("dic_favs", JSON.stringify(a)); }catch(e){} }
    function toggleFav(idiom){ let a=getFavs(); a = a.includes(idiom) ? a.filter(x=>x!==idiom) : a.concat(idiom); setFavs(a); }
    const browseState = { cat:"全部", q:"" };
    let overlayOpen = false;

    // 读取本地偏好
    try{
      const a = localStorage.getItem("dic_accent"); if(a) state.accent = a;
      const s = localStorage.getItem("dic_skin"); if(s!==null && SKINS[+s]) state.skin = +s;
    }catch(e){}

    function dayOfYear(date){ const start=new Date(date.getFullYear(),0,0); return Math.floor((date-start)/86400000); }
    function idiomFor(date){ const n=dayOfYear(date); return IDIOMS[((n-1)%IDIOMS.length+IDIOMS.length)%IDIOMS.length]; }

    function applySkin(){
      document.documentElement.setAttribute("data-skin", SKINS[state.skin][0]);
      $("btnSkin").textContent = "皮肤·" + SKINS[state.skin][1];
    }

    function render(dir){
      const base = new Date();
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
      d.setDate(d.getDate() + state.offset);
      const idiom = state.pickIndex==null ? idiomFor(d) : IDIOMS[state.pickIndex];
      current = { idiom, d };

      const accent = state.accent === "auto" ? idiom.tone : state.accent;
      document.documentElement.setAttribute("data-accent", accent);
      document.querySelectorAll("#segAccent button").forEach(b=> b.classList.toggle("on", b.dataset.v===state.accent));

      $("md").textContent = MONTHS[d.getMonth()] + d.getDate() + "日";
      $("year").textContent = d.getFullYear();
      $("week").textContent = WEEK[d.getDay()];
      $("stamp").textContent = WEEK[d.getDay()];

      const y=d.getFullYear(), m=d.getMonth()+1, dd=d.getDate();
      const lu = L.lunarFromSolar(y,m,dd);
      const gz = L.lunarYearGz(lu.lYear);
      $("lunar").textContent = "农历 " + L.lunarLabel(lu) + " · " + gz.ganzhi + " " + gz.zodiac;

      const on = L.solarTermOf(y,m,dd);
      if(on){
        $("term").textContent = on.name; $("term").parentElement.classList.add("term");
        $("termpill").classList.add("on"); $("termpillText").textContent = "今日 · " + on.name;
      } else {
        const nx = L.nextSolarTerm(y,m,dd);
        $("term").textContent = nx.days===0 ? "-" : (nx.days+"天");
        $("term").parentElement.classList.remove("term");
        $("termpill").classList.remove("on");
        $("termpillText").textContent = nx.days===0 ? "" : "距「"+nx.name+"」"+nx.days+"天";
      }

      $("big").innerHTML = idiom.idiom.split("").map(c=>`<span class="ch">${c}</span>`).join("");
      $("pinyin").textContent = idiom.pinyin;
      $("charRow").innerHTML = idiom.chars.map(x=>`<div class="char-cell"><div class="big">${x.c}</div><div class="py">${x.p}</div></div>`).join("");
      $("meaningCn").textContent = idiom.meaningCn;
      $("meaningEn").textContent = idiom.meaningEn;
      $("exampleCn").textContent = idiom.exampleCn;
      $("examplePy").textContent = idiom.examplePy;
      $("exampleEn").textContent = idiom.exampleEn;

      // 收藏按钮状态
      const fav = getFavs().includes(idiom.idiom);
      $("btnFav").classList.toggle("on", fav);
      $("btnFav").textContent = fav ? "♥ 已收藏" : "♡ 收藏";

      $("foot").textContent = state.pickIndex!=null
        ? `浏览中 · 成语「${idiom.idiom}」 · 第 ${state.pickIndex+1}/${IDIOMS.length} 条 · 按「今天」返回今日`
        : (state.offset===0
          ? `今天是 ${MONTHS[d.getMonth()]}${dd}日 · 成语「${idiom.idiom}」 · 已收录 ${IDIOMS.length} 条 · 撕下一页看新成语`
          : `${MONTHS[d.getMonth()]}${dd}日 · 「${idiom.idiom}」 · 按「今天」返回`);

      if(dir){ card.classList.remove("in-next","in-prev"); void card.offsetWidth; card.classList.add(dir==="next"?"in-next":"in-prev"); }
    }

    function go(delta, dir){ state.pickIndex=null; state.offset += delta; render(dir); }
    function goToday(){ state.pickIndex=null; state.offset=0; render("next"); }
    function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

    let toastTimer=null;
    function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800); }

    function shareText(){
      if(!current) return "";
      const i = current.idiom;
      return `【每日成语】${i.idiom}　${i.pinyin}\n释义：${i.meaningCn}\n例句：${i.exampleCn}\n—— 每日成语日历 ${SITE}`;
    }
    async function doShare(){
      const text = shareText();
      try{
        if(navigator.share){ await navigator.share({ title:"每日成语 "+current.idiom.idiom, text }); return; }
      }catch(e){ /* 用户取消或不支持，走复制 */ }
      try{
        await navigator.clipboard.writeText(text); toast("已复制今日成语，去粘贴分享吧");
      }catch(e){
        const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); toast("已复制今日成语"); }catch(_){ toast("复制失败，请手动选择"); }
        document.body.removeChild(ta);
      }
    }

    // 事件
    $("btnPrev").addEventListener("click", ()=>go(-1,"prev"));
    $("btnNext").addEventListener("click", ()=>go(1,"next"));
    $("btnToday").addEventListener("click", goToday);
    $("btnShare").addEventListener("click", doShare);
    $("btnRandom").addEventListener("click", ()=>{ let i; do{ i=Math.floor(Math.random()*IDIOMS.length); }while(i===state.pickIndex && IDIOMS.length>1); state.pickIndex=i; render("next"); });
    $("btnFav").addEventListener("click", ()=>{ if(!current) return; toggleFav(current.idiom.idiom); render(); if(overlayOpen) buildGrid(); });

    // 浏览面板
    function buildChips(){
      chips.innerHTML = CATS.map(c=>`<button class="chip${c===browseState.cat?' on':''}" data-c="${c}">${c}</button>`).join("");
      chips.querySelectorAll(".chip").forEach(b=> b.addEventListener("click", ()=>{ browseState.cat=b.dataset.c; buildChips(); buildGrid(); }));
    }
    function buildGrid(){
      const q = browseState.q.trim().toLowerCase();
      const favs = getFavs();
      let list = IDIOMS.map((x,i)=>({x,i}));
      if(browseState.cat==="收藏") list = list.filter(o=>favs.includes(o.x.idiom));
      else if(browseState.cat!=="全部") list = list.filter(o=>o.x._cat===browseState.cat);
      if(q) list = list.filter(o=> (o.x.idiom + o.x.pinyin + o.x.meaningCn).toLowerCase().includes(q));
      $("panelCount").textContent = list.length + " 条";
      if(!list.length){ grid.innerHTML = `<div class="empty">${browseState.cat==="收藏"?"还没有收藏，点卡片下方的 ♡ 收藏":"没有匹配的成语"}</div>`; return; }
      grid.innerHTML = list.map(o=>{
        const f = favs.includes(o.x.idiom) ? ' <span class="gh">♥</span>' : '';
        return `<div class="gcell" data-i="${o.i}"><div class="gi">${o.x.idiom}</div><div class="gp">${o.x.pinyin}${f}</div></div>`;
      }).join("");
      grid.querySelectorAll(".gcell").forEach(el=> el.addEventListener("click", ()=>{ state.pickIndex=+el.dataset.i; closeBrowse(); render("next"); }));
    }
    function openBrowse(){ overlayOpen=true; overlay.classList.add("show"); buildChips(); buildGrid(); }
    function closeBrowse(){ overlayOpen=false; overlay.classList.remove("show"); }
    $("btnBrowse").addEventListener("click", openBrowse);
    $("btnClose").addEventListener("click", closeBrowse);
    overlay.addEventListener("click", e=>{ if(e.target===overlay) closeBrowse(); });
    searchInput.addEventListener("input", ()=>{ browseState.q=searchInput.value; buildGrid(); });
    $("btnSkin").addEventListener("click", ()=>{ state.skin=(state.skin+1)%SKINS.length; applySkin(); save("dic_skin",state.skin); });
    document.querySelectorAll("#segAccent button").forEach(b=>{
      b.addEventListener("click", ()=>{ state.accent=b.dataset.v; save("dic_accent",state.accent); render(); });
    });
    window.addEventListener("keydown", e=>{
      if(e.key==="Escape" && overlayOpen){ closeBrowse(); return; }
      if(overlayOpen || e.target===searchInput) return; // 浏览/搜索时不翻页
      if(e.key==="ArrowRight") go(1,"next");
      else if(e.key==="ArrowLeft") go(-1,"prev");
      else if(e.key===" "||e.key==="Home"){ e.preventDefault(); goToday(); }
    });
    let tsx=0,tsy=0;
    card.addEventListener("touchstart", e=>{ const t=e.changedTouches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
    card.addEventListener("touchend", e=>{ const t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy; if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ dx<0?go(1,"next"):go(-1,"prev"); } }, {passive:true});

    applySkin();
    render();
  </script>
</body>
</html>
